[package]
name = "isotope-launch"
version = "0.1.0"
description = "Isotope launchpad: owns the DBC partner PDA and cranks a migrated launch into two cp-swap pairs and the launch multipool"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "isotope_launch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
