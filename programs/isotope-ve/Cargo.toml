[package]
name = "isotope-ve"
version = "0.1.0"
description = "Isotope ve(3,3): lock the protocol token, vote per collection gauge, get paid in that collection's quote; treasury recycles protocol fees into protocol-owned cp-swap LP"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "isotope_ve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
localnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
