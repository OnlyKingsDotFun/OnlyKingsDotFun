[package]
name = "collection-amm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
svm-tests = []

[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }
pinocchio-system = "=0.6.1"
pinocchio-token = "=0.7.0"
borsh = { version = "1.6", default-features = false, features = ["derive"] }
ethnum = { version = "1.5", default-features = false }

[dev-dependencies]
mollusk-svm = "=0.15.1"
mollusk-svm-programs-token = "=0.15.1"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-sdk-ids = "3"
spl-token-2022-interface = "=3.1.1"
solana-program-pack = "3"
